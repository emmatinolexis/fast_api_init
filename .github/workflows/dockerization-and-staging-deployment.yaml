name: Dockerization And Staging Deployment
on:
  pull_request:
    branches:
      - 'main'
  push:
    branches:
      - 'main'

jobs:
  build-and-upload-docker-image:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v3
      -
        name: QEMU Setup
        uses: docker/setup-qemu-action@v2
      -
        name: Buildx Docker Setup
        uses: docker/setup-buildx-action@v2
      - 
        name: Bump Version and Push tag
        id: version_bump
        uses: anothrNick/github-tag-action@1.61.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: main
          DEFAULT_BUMP: patch
          WITH_V: true
      - if: steps.version_bump.outputs.new_tag != steps.version_bump.outputs.old_tag
        name: DockerHub Authentication
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - if: steps.version_bump.outputs.new_tag != steps.version_bump.outputs.old_tag
        name: Build And Push Image
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: sagemicrosystems/mvi-hub:${{ steps.version_bump.outputs.new_tag }}
    outputs:
      NEW_TAG: ${{ steps.version_bump.outputs.new_tag }}
      OLD_TAG: ${{ steps.version_bump.outputs.old_tag }}
  deploy-docker-image-on-staging:
    runs-on: ubuntu-latest
    environment: staging
    needs:
      - build-and-upload-docker-image
    steps:
      - name: Set tag as environment variable
        run: |
          echo "NEW_TAG=${{ needs.build-and-upload-docker-image.outputs.NEW_TAG }}" >> $GITHUB_ENV
          echo "OLD_TAG=${{ needs.build-and-upload-docker-image.outputs.OLD_TAG }}" >> $GITHUB_ENV
      - name: SSH Into AWS And Deploy
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.STAGING_SERVER_IP }}
          username: ${{ secrets.STAGING_SERVER_USERNAME }}
          key: ${{ secrets.STAGING_SERVER_SSH_KEY }}
          password: ""
          passphrase: ""
          port: 22
          script: |
            docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_PASSWORD }}
            docker stop $(docker ps -a -q --filter="name=mvi_staging_api")
            docker rm $(docker ps -a -q --filter="name=mvi_staging_api")
            docker image rm -f sagemicrosystems/mvi-hub:${{ env.OLD_TAG }}
            docker run -d --publish 8000:8000 --name mvi_staging_api -e API_VERSION=${{ secrets.API_VERSION }} \
            -e DB_HOST=${{ secrets.DB_HOST }} -e DB_NAME=${{ secrets.DB_NAME }} -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} -e DB_PORT=${{ secrets.DB_PORT }} \
            -e DB_USER=${{ secrets.DB_USER }} -e ENV=staging -e MAIL_SERVER=${{ secrets.MAIL_SERVER }} -e MAIL_USERNAME=${{ secrets.MAIL_USERNAME }} \
            -e MQTT_HOST=${{ secrets.MQTT_HOST }} -e MQTT_PORT=${{ secrets.MQTT_PORT }} -e MQTT_TOPIC=${{ secrets.MQTT_TOPIC }} -e MQTT_USER=${{ secrets.MQTT_USER }} \
            -e MQTT_PASSWORD=${{ secrets.MQTT_PASSWORD }} -e MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }} -e SECRET_KEY=${{ secrets.SECRET_KEY }} -e GRAYLOG_HOST=${{ secrets.GRAYLOG_HOST }} -e GRAYLOG_PORT=${{ secrets.GRAYLOG_PORT }} sagemicrosystems/mvi-hub:${{ env.NEW_TAG }}
