name: Dockerization And Staging Deployment
on:
  pull_request:
    branches:
      - 'main'
  push:
    branches:
      - 'main'

jobs:
  build-and-upload-docker-image:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v3
      -
        name: QEMU Setup
        uses: docker/setup-qemu-action@v2
      -
        name: Buildx Docker Setup
        uses: docker/setup-buildx-action@v2
      -
        name: DockerHub Authentication
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      -
        name: Build And Push Image
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: sagemicrosystems/mvi-hub:latest
  
  deploy-docker-image-on-staging:
    runs-on: ubuntu-latest
    environment: staging
    needs:
      - build-and-upload-docker-image
    steps:
      - name: SSH Into AWS And Deploy
        uses: appleboy/ssh-action@v0.1.7
        env:
          API_VERSION: ${{ secrets.API_VERSION }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          ENV: ${{ secrets.ENV }}
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        with:
          host: ${{ secrets.STAGING_SERVER_IP }}
          username: ${{ secrets.STAGING_SERVER_USERNAME }}
          key: ${{ secrets.STAGING_SERVER_SSH_KEY }}
          password: ""
          passphrase: ""
          port: 22
          allenvs: true
          script: |
            docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_PASSWORD }}
            docker stop $(docker ps -a -q)
            docker rm $(docker ps -a -q)
            docker image rm -f sagemicrosystems/mvi-hub:latest
            docker run -d --publish 8000:8000 --name mvi_staging_api -e API_VERSION=$API_VERSION \
            -e DB_HOST=$DB_HOST -e DB_NAME=$DB_NAME -e DB_PASSWORD=$DB_PASSWORD -e DB_PORT=$DB_PORT \
            -e DB_USER=$DB_USER -e ENV=$ENV -e MAIL_SERVER=$MAIL_SERVER -e MAIL_USERNAME=$MAIL_USERNAME \
            -e MAIL_PASSWORD=$MAIL_PASSWORD -e SECRET_KEY=$SECRET_KEY sagemicrosystems/mvi-hub:latest
