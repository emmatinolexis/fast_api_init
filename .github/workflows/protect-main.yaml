name: protect-main
on:
  pull_request:
    branches:
      - main
jobs:
  protect-main:
    runs-on: ubuntu-latest
    steps:
      - name: protect main branch
        run: |
          if [[ "${{ github.event.pull_request.head.ref }}" != "development" || "${{ github.event.pull_request.title }}" != "staging-pr" ]];
          then
            echo "::error ::Pull requests must originate from the development branch with the title 'staging-pr'."
            exit 1
          fi