name: protect-main
on:
  pull_request:
    branches:
      - main
jobs:
  protect-main:
    runs-on: ubuntu-latest
    steps:
      - name: protect main branch
        run: |
          if [[ "${{ github.event.pull_request.head.ref }}" != "staging-pr" ]];
          then
            echo "::error ::Only staging-pr may be used to create pull requests into main"
            exit 1
          fi