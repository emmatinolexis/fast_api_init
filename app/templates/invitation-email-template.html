<html>
  <head>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body,
      button {
        font-family: "Inter", sans-serif;
      }

      @media (max-width: 768px) {
        .container {
          background-color: white !important;
        }

        .responsive-div {
          width: 100% !important;
          height: 100% !important;
        }
      }
    </style>
  </head>
  <body
    class="container"
    style="
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #ededed;
      height: 100vh;
    "
  >
    <div
      class="responsive-div"
      style="
        width: 60%;
        background-color: white;
        border-radius: 8px;
        padding: 20px;
      "
    >
      <p style="font-size: 20px; font-weight: bold">
        Hello, {{recipient_name}}
      </p>
      <p>{{ invitee_name }} has invited you to join the MVI Tracking System</p>
      <p>To accept, click "Accept Invite" button below. To decline, click "Reject Invite" button below</p>

      <button
          style="
            background: #00458d;
            color: white;
            font-size: 20px;
            padding: 18px 25px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
          "
        >
          Accept Invite
        </button>

        <button
          style="
            background: #00458d;
            color: white;
            font-size: 20px;
            padding: 18px 25px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
          "
        >
          Reject Invite
        </button>
    </div>
  </body>
</html>
